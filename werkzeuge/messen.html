<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Dehnfiguren messen</title></head>
<body><pre id="info">läuft …</pre>
<script type="module">
  // Werkzeug: misst die Figur (mit ?modell=1 das lokale Modell) in Start- und Zielhaltung und prüft sie gegen die
  // Sollwerte aus werkzeuge/soll.ts. ?ids=a,b nur diese, ?roh=1 zusätzlich alle Punkte.
  import { _messen, modellSetzen } from "../src/ui/dehnfigur.ts"
  import { modellLaden } from "../src/ui/modellladen.ts"
  import { DEHNUNGEN } from "../src/daten/dehnungen/index.ts"
  import { SOLL } from "./soll.ts"
  const q = new URLSearchParams(location.search)
  if (q.get("modell")) modellSetzen(await modellLaden("./privat/figur.bin"))
  // ?alle=1: alle Dehnungen, ohne Sollwerte nur die Grundprüfung (tiefster Punkt, Verschiebung, Restfehler)
  const ids = q.get("ids") ? q.get("ids").split(",") : q.get("alle") ? Object.keys(DEHNUNGEN) : Object.keys(SOLL)
  const aus = {}
  let fehler = 0, gesamt = 0
  for (const id of ids) try { console.log("start", id, Math.round(performance.now()))
    const d = DEHNUNGEN[id]
    if (!d) { aus[id] = "keine Dehnung"; continue }
    const ziel = d.ziel || d.schritte[Math.floor(d.schritte.length / 2)].h
    const start = d.art === "folge" ? d.schritte[0].h : d.start
    const t0 = performance.now()
    const m = { start: _messen(d, start), ziel: _messen(d, ziel) }
    m.alle = d.art === "folge" ? [...new Set(d.schritte.map((x) => x.h))].map((h) => _messen(d, h)) : [m.start, m.ziel]
    const ms = Math.round(performance.now() - t0)
    const r = SOLL[id] ? SOLL[id](m) : []
    if (!SOLL[id]) aus[id + "#grund"] = m.alle.map((x) => ({ tief: x._tief, schub: x._schub, was: x._was, rest: x._rest[0], wo: x._restWo }))
    const falsch = r.filter((x) => !(x.wert >= x.min && x.wert <= x.max))
    gesamt += r.length; fehler += falsch.length
    aus[id] = { falsch: falsch.map((x) => `${x.was}: ${x.wert} (Soll ${x.min} bis ${x.max}) – ${x.quelle}`), ok: r.length - falsch.length, ms }
    if (q.get("roh")) aus[id].punkte = m
  } catch (e) { aus[id] = "FEHLER " + e.message; fehler++ }
  document.getElementById("info").textContent = JSON.stringify({ gesamt, fehler, ergebnis: aus }, null, 1)
  window.fertig = true
</script></body></html>
