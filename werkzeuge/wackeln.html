<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Knie und Ellbogen: Wackeln messen</title></head>
<body><pre id="info">läuft …</pre>
<script type="module">
  // Werkzeug: misst über eine Runde der Bewegung, wie stark Knie und Ellbogen seitlich um die Linie Hüfte–Knöchel
  // bzw. Schulter–Handgelenk hin und her drehen. Eine saubere Bewegung dreht höchstens einmal hin und zurück:
  // Weg = 2 × Spanne. Was darüber liegt, ist Wackeln. ?ids=a,b nur diese, sonst alle; ?n=120 Bilder je Runde.
  import { _bahn, modellSetzen } from "../src/ui/dehnfigur.ts"
  import { modellLaden } from "../src/ui/modellladen.ts"
  import { DEHNUNGEN } from "../src/daten/dehnungen/index.ts"
  const q = new URLSearchParams(location.search)
  if (q.get("modell")) modellSetzen(await modellLaden("./privat/figur.bin"))
  const ids = q.get("ids") ? q.get("ids").split(",") : Object.keys(DEHNUNGEN)
  const n = Number(q.get("n") || 120)
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]]
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
  const kreuz = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
  const len = (a) => Math.hypot(...a)
  const norm = (a) => { const l = len(a) || 1; return a.map((x) => x / l) }
  const senk = (v, a) => { const k = dot(v, a); return [v[0] - k * a[0], v[1] - k * a[1], v[2] - k * a[2]] }
  function glied(bahn, oben, mitte, unten) {
    // Drehung des Gelenks um die Linie oben–unten von Bild zu Bild, mitbewegt mit der Linie (unabhängig von der
    // Richtung im Raum): voriger Abstandsvektor auf die Ebene senkrecht zur neuen Linie, dann der Winkel dazu
    const arm = []
    let weg = 0, wegCm = 0, sprungCm = 0, kum = 0, kumCm = 0, min = 0, max = 0, minCm = 0, maxCm = 0
    let vorher = null
    for (const b of bahn) {
      const a = norm(sub(b[unten], b[oben]))
      const p = senk(sub(b[mitte], b[oben]), a)
      const l = len(p)
      if (l < 0.03) { vorher = null; continue }
      arm.push(l)
      if (vorher) {
        const q = senk(vorher, a)
        if (len(q) > 0.02) {
          const d = (Math.atan2(dot(kreuz(q, p), a), dot(q, p)) * 180) / Math.PI
          const cm = ((Math.abs(d) * Math.PI) / 180) * ((l + len(q)) / 2) * 100
          weg += Math.abs(d); wegCm += cm; sprungCm = Math.max(sprungCm, cm)
          kum += d; kumCm += Math.sign(d) * cm
          min = Math.min(min, kum); max = Math.max(max, kum); minCm = Math.min(minCm, kumCm); maxCm = Math.max(maxCm, kumCm)
        }
      }
      vorher = p
    }
    const spanne = max - min, spanneCm = maxCm - minCm
    return { gueltig: arm.length, spanne: Math.round(spanne), weg: Math.round(weg), spanneCm: Math.round(spanneCm * 10) / 10, sprungCm: Math.round(sprungCm * 10) / 10, cm: Math.round(Math.max(0, wegCm - 2 * spanneCm) * 10) / 10 }
  }
  const aus = {}
  for (const id of ids) {
    const d = DEHNUNGEN[id]
    if (!d) continue
    try {
      const bahn = _bahn(d, n)
      const r = {}
      for (const s of ["l", "r"]) {
        r["knie_" + s] = glied(bahn, "huefte_" + s, "knie_" + s, "fuss_" + s)
        r["ellbogen_" + s] = glied(bahn, "schulter_" + s, "ellbogen_" + s, "hand_" + s)
      }
      aus[id] = r
    } catch (e) {
      aus[id] = "FEHLER " + e.message
    }
  }
  document.getElementById("info").textContent = JSON.stringify(aus)
  window.fertig = true
</script></body></html>
