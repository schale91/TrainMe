<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Paket prüfen</title></head>
<body><pre id="info"></pre>
<script type="module">
  import * as THREE from "three"
  import { modellLaden } from "../src/ui/modellladen.ts"
  const m = await modellLaden("./privat/figur.bin")
  const z = []
  m.updateMatrixWorld(true)
  const box = new THREE.Box3().setFromObject(m)
  z.push("box " + box.min.toArray().map((x) => x.toFixed(2)) + " / " + box.max.toArray().map((x) => x.toFixed(2)))
  m.traverse((o) => {
    if (o.isMesh) z.push("MESH " + o.name + " skinned=" + !!o.isSkinnedMesh + " attrs=" + Object.keys(o.geometry.attributes).join(",") + " morph=" + Object.keys(o.geometry.morphAttributes).join(",") + " mat=" + [].concat(o.material).map((x) => x.name).join(",") + " scale=" + o.getWorldScale(new THREE.Vector3()).toArray().map((x) => x.toFixed(3)))
    if (/Hip|Thigh$|Thigh_\d/.test(o.name)) z.push("NODE " + o.name + " bone=" + !!o.isBone + " y=" + o.getWorldPosition(new THREE.Vector3()).y.toFixed(3) + " ws=" + o.getWorldScale(new THREE.Vector3()).x.toFixed(4))
  })
  z.push("root scale " + m.scale.toArray() + " children " + m.children.map((c) => c.name + ":" + c.scale.x.toFixed(3) + ":" + c.rotation.x.toFixed(2)).join(" "))
  document.getElementById("info").textContent = z.join("\n")
  window.fertig = true
</script></body></html>
