<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Modell packen</title></head>
<body><pre id="info"></pre>
<script type="module">
  // Wandelt das FBX aus werkzeuge/privat in das TrainMe-Paket (figur.bin): unsichtbare Teile und Texturen weg,
  // freundlicher Ausdruck fest eingerechnet, nur das Blinzeln bleibt als Gesichtsausdruck erhalten.
  import { FBXLoader } from "three/examples/jsm/loaders/FBXLoader.js"
  import { GLTFExporter } from "three/examples/jsm/exporters/GLTFExporter.js"
  import { packen } from "../src/ui/modellpaket.ts"
  const AUSDRUCK = { Mouth_Smile: 0.5, Cheek_Raise_L: 0.3, Cheek_Raise_R: 0.3, Eye_Squint_L: 0.1, Eye_Squint_R: 0.1, Brow_Raise_Inner_Left: 0.15, Brow_Raise_Inner_Right: 0.15 }
  const BEHALTEN = ["Eyes_Blink"]
  const obj = await new FBXLoader().loadAsync("./privat/frau.fbx")
  const weg = []
  obj.traverse((o) => { if (o.isMesh && /Tongue|Teeth|OEM3Dlusion|Occlusion|TearLine|Underwear/.test(o.name)) weg.push(o) })
  for (const o of weg) o.parent.remove(o)
  obj.traverse((o) => {
    if (!o.isMesh) return
    for (const m of [].concat(o.material)) { m.map = null; m.normalMap = null; m.alphaMap = null; m.specularMap = null; m.bumpMap = null }
    const g = o.geometry
    const dict = o.morphTargetDictionary
    if (!dict || !g.morphAttributes.position) return
    const pos = g.getAttribute("position")
    const rel = g.morphTargetsRelative
    const kurz = (k) => k.slice(k.lastIndexOf(".") + 1)
    // Ausdruck einrechnen
    for (const [k, i] of Object.entries(dict)) {
      const w = AUSDRUCK[kurz(k)]
      if (!w) continue
      const ziel = g.morphAttributes.position[i]
      for (let v = 0; v < pos.count; v++)
        for (let a = 0; a < 3; a++) {
          const basis = pos.getComponent(v, a), t = ziel.getComponent(v, a)
          pos.setComponent(v, a, basis + w * (rel ? t : t - basis))
        }
    }
    pos.needsUpdate = true
    // nur das Blinzeln behalten
    const neu = {}, attrs = { position: [], normal: [] }
    for (const [k, i] of Object.entries(dict)) {
      if (!BEHALTEN.includes(kurz(k))) continue
      neu[kurz(k)] = attrs.position.length
      attrs.position.push(g.morphAttributes.position[i])
      if (g.morphAttributes.normal) attrs.normal.push(g.morphAttributes.normal[i])
    }
    g.morphAttributes = attrs.position.length ? (attrs.normal.length ? attrs : { position: attrs.position }) : {}
    o.morphTargetDictionary = attrs.position.length ? neu : undefined
    o.morphTargetInfluences = attrs.position.length ? attrs.position.map(() => 0) : undefined
    // Normalen nicht neu berechnen: das Modell ist nicht indiziert, neu berechnet würde es kantig
  })
  const glb = await new GLTFExporter().parseAsync(obj, { binary: true, onlyVisible: false })
  const bin = packen(new Uint8Array(glb))
  window.ergebnis = { glb: glb.byteLength, bin: bin.byteLength, daten: Array.from(bin) }
  document.getElementById("info").textContent = "glb " + glb.byteLength + " bin " + bin.byteLength
  window.fertig = true
</script></body></html>
