<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Dehnfiguren prüfen</title></head>
<body><pre id="info">läuft …</pre>
<script type="module">
  // Werkzeug: sucht in allen Dehnfiguren Stellen, an denen der Körper in Boden oder Hilfsmittel eintaucht.
  // ?modell=1 prüft mit dem lokalen Modell aus werkzeuge/privat (liegt nicht im Repository), ?ids=a,b nur diese.
  import { _durchdringungen, modellSetzen } from "../src/ui/dehnfigur.ts"
  import { modellLaden } from "../src/ui/modellladen.ts"
  import { DEHNUNGEN, TEST_DEHNUNGEN } from "../src/daten/dehnungen/index.ts"
  const q = new URLSearchParams(location.search)
  if (q.get("modell")) modellSetzen(await modellLaden("./privat/figur.bin"))
  const alle = { ...DEHNUNGEN, ...TEST_DEHNUNGEN }
  const ids = q.get("ids") ? q.get("ids").split(",") : Object.keys(alle)
  const ergebnis = {}
  for (const id of ids) {
    const f = _durchdringungen(alle[id], 8, Number(q.get("schritt") || 0.5))
    if (!f.length) continue
    // je Gegenstand die tiefste Stelle
    const je = {}
    for (const x of f) if (!je[x.was] || je[x.was].tiefe < x.tiefe) je[x.was] = x
    ergebnis[id] = Object.values(je).map((x) => `${x.was} ${(x.tiefe * 100).toFixed(1)} cm bei t=${x.t} (Höhe ${(x.hoehe * 100).toFixed(0)} cm)`)
  }
  document.getElementById("info").textContent = JSON.stringify(ergebnis, null, 1)
  window.fertig = true
</script></body></html>
