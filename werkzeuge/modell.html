<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Modell prüfen</title>
<style>body{margin:0;background:#2a2650;color:#fff;font:13px monospace} canvas{display:block}</style></head>
<body><canvas id="c" width="900" height="700"></canvas><pre id="info"></pre>
<script type="module">
  import * as THREE from "three"
  import { FBXLoader } from "three/examples/jsm/loaders/FBXLoader.js"
  const info = document.getElementById("info")
  const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true })
  r.outputColorSpace = THREE.SRGBColorSpace
  const s = new THREE.Scene()
  s.add(new THREE.HemisphereLight("#fff", "#887", 1.5))
  const l = new THREE.DirectionalLight("#fff", 2); l.position.set(2, 4, 3); s.add(l)
  const cam = new THREE.PerspectiveCamera(30, 900 / 700, 0.1, 5000)
  new FBXLoader().load("./privat/frau.fbx", (obj) => {
    s.add(obj)
    const box = new THREE.Box3().setFromObject(obj)
    const gr = box.getSize(new THREE.Vector3()), mi = box.getCenter(new THREE.Vector3())
    const zeilen = ["Größe: " + gr.toArray().map((x) => x.toFixed(2)).join(" "), "Mitte: " + mi.toArray().map((x) => x.toFixed(2)).join(" ")]
    obj.traverse((o) => {
      if (o.isBone) zeilen.push("BONE " + o.name + " parent=" + (o.parent && o.parent.name))
      if (o.isMesh && o.morphTargetDictionary) zeilen.push("MORPH " + o.name + ": " + Object.keys(o.morphTargetDictionary).join(", "))
      if (o.isMesh) zeilen.push("MESH " + o.name + " skinned=" + !!o.isSkinnedMesh + " verts=" + o.geometry.attributes.position.count + " mat=" + [].concat(o.material).map((m) => m.name + (m.map ? "(tex)" : "")).join(","))
    })
    zeilen.push("Animationen: " + obj.animations.length)
    const v = new THREE.Vector3()
    for (const n of ["EM3D_Base_Hip", "EM3D_Base_Pelvis", "EM3D_Base_Waist", "EM3D_Base_Spine01", "EM3D_Base_Spine02", "EM3D_Base_NeckTwist01", "EM3D_Base_Head", "EM3D_Base_L_Breast", "EM3D_Base_L_Clavicle", "EM3D_Base_L_Upperarm", "EM3D_Base_L_Forearm", "EM3D_Base_L_Hand", "EM3D_Base_L_Mid1", "EM3D_Base_L_Thigh", "EM3D_Base_L_Calf", "EM3D_Base_L_Foot", "EM3D_Base_L_ToeBase"]) {
      const o = obj.getObjectByName(n)
      if (o) { o.getWorldPosition(v); zeilen.push("POS " + n + " " + v.toArray().map((x) => x.toFixed(1)).join(" ")) }
    }
    obj.traverse((o) => { if (o.isMesh) { const b = new THREE.Box3().setFromBufferAttribute(o.geometry.attributes.position); zeilen.push("GEO " + o.name + " " + b.min.toArray().map((x) => x.toFixed(1)).join(",") + " / " + b.max.toArray().map((x) => x.toFixed(1)).join(",") + " scale " + o.getWorldScale(v).toArray().map((x) => x.toFixed(3)).join(",")) } })
    info.textContent = zeilen.join("\n")
    const ansicht = new URLSearchParams(location.search).get("v") || "vorn"
    const d = Math.max(gr.x, gr.y, gr.z) * 2.2
    cam.position.set(mi.x + (ansicht === "seite" ? d : 0), mi.y, mi.z + (ansicht === "seite" ? 0 : d))
    cam.lookAt(mi)
    r.render(s, cam)
    window.fertig = true
  }, undefined, (e) => { info.textContent = "FEHLER " + e; window.fertig = true })
</script></body></html>
