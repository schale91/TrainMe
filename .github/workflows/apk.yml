# Baut bei jedem Push die App, prüft die Tests und erstellt aus main eine signierte APK als GitHub-Release.
# Download immer unter: https://github.com/<besitzer>/TrainMe/releases/latest/download/TrainMe.apk
name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Modell der Dehnfigur
        env:
          MODELL_TOKEN: ${{ secrets.MODELL_TOKEN }}
        run: |
          # Lizenziertes Modell aus dem privaten Repo TrainMe-Modell; ohne Zugang zeigt die App die einfache Figur
          if [ -n "$MODELL_TOKEN" ]; then
            # Ein falsch eingerichteter Token soll den Build nicht stoppen, nur das Modell fehlt dann
            if git clone --quiet --depth 1 "https://x-access-token:${MODELL_TOKEN}@github.com/${{ github.repository_owner }}/TrainMe-Modell.git" "$RUNNER_TEMP/modell"; then
              mkdir -p public/modell
              cp "$RUNNER_TEMP/modell/figur.bin" public/modell/figur.bin
              rm -rf "$RUNNER_TEMP/modell"
              echo "Modell übernommen: $(stat -c %s public/modell/figur.bin) Bytes"
            else
              echo "::warning::MODELL_TOKEN hat keinen Lesezugriff auf TrainMe-Modell (Contents: Read-only): die Dehnfigur nutzt die einfache gezeichnete Figur."
            fi
          else
            echo "::warning::Secret MODELL_TOKEN fehlt: die Dehnfigur nutzt die einfache gezeichnete Figur."
          fi

      - name: Tests und Typen
        run: |
          npm test
          npx tsc -b

      - name: Web-App bauen
        env:
          TRAINME_BUILD: ${{ github.run_number }}
          TRAINME_KANAL: ${{ github.event_name == 'pull_request' && 'vorschau' || 'stabil' }}
        run: |
          export TRAINME_VERSION="$(node -p "require('./package.json').version").$TRAINME_BUILD"
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: In das Android-Projekt kopieren
        run: npx cap sync android

      - name: Signaturschlüssel
        id: schluessel
        env:
          KEYSTORE: ${{ secrets.TRAINME_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/trainme.jks"
            echo "datei=$RUNNER_TEMP/trainme.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret TRAINME_KEYSTORE fehlt: es entsteht nur eine Test-APK, die sich nicht über ältere Versionen installieren lässt."
          fi

      - name: APK bauen
        working-directory: android
        env:
          TRAINME_KEYSTORE_DATEI: ${{ steps.schluessel.outputs.datei }}
          TRAINME_KEYSTORE_PASSWORT: ${{ secrets.TRAINME_KEYSTORE_PASSWORT }}
        run: |
          version=$(node -p "require('../package.json').version")
          chmod +x gradlew
          if [ -n "$TRAINME_KEYSTORE_DATEI" ]; then aufgabe=assembleRelease; art=release; else aufgabe=assembleDebug; art=debug; fi
          ./gradlew --no-daemon "$aufgabe" -PversionCode=${{ github.run_number }} -PversionName="$version.${{ github.run_number }}"
          cp app/build/outputs/apk/$art/*.apk ../TrainMe.apk
          echo "VERSION=$version.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "SIGNIERT=$([ "$art" = release ] && echo ja || echo nein)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TrainMe-${{ env.VERSION }}
          path: TrainMe.apk

      - name: Vorschau veröffentlichen
        if: github.event_name == 'pull_request' && env.SIGNIERT == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fester Link für Test-APKs aus offenen Pull Requests, ohne ZIP und ohne Anmeldung
          gh release delete vorschau --yes --cleanup-tag 2>/dev/null || true
          gh release create vorschau TrainMe.apk \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "TrainMe Vorschau $VERSION" \
            --notes "Testversion aus einem offenen Pull Request. Kann Fehler enthalten. Stabile Version: Releases mit Versionsnummer." \
            --prerelease

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' && env.SIGNIERT == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" TrainMe.apk \
            --title "TrainMe $VERSION" \
            --generate-notes \
            --notes "APK herunterladen, öffnen und installieren (einmalig „Unbekannte Apps installieren“ erlauben). Updates einfach drüber installieren, die Daten bleiben erhalten." \
            --latest
