name: Feedback
description: Allgemeine Rückmeldung zur App
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Beschreibung
      description: Was gefällt dir, was stört dich?
    validations:
      required: true
  - type: input
    id: bereich
    attributes:
      label: Bereich der App
      placeholder: z. B. Training, Pausentimer, Abenteuer
  - type: input
    id: version
    attributes:
      label: App-Version und Gerät
      description: Wird aus der App automatisch ausgefüllt.
