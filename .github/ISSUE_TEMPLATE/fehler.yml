name: Fehler
description: Etwas funktioniert nicht wie erwartet
title: "[Fehler] "
labels: ["fehler"]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Beschreibung
      description: Was hast du gemacht, was ist passiert, was hättest du erwartet?
    validations:
      required: true
  - type: input
    id: bereich
    attributes:
      label: Bereich der App
      placeholder: z. B. Training, Pausentimer, Abenteuer
  - type: input
    id: version
    attributes:
      label: App-Version und Gerät
      description: Wird aus der App automatisch ausgefüllt.
